<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>16种成像技术产业化现状与成熟度矩阵</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #f8f9fa; }
        #chart-container { width: 100%; height: 85vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { color: #2c3e50; margin: 0 0 8px 0; }
        .header p { color: #7f8c8d; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🚀 16项成像技术产业化与应用现状矩阵 (Status Quo)</h2>
        <p>展现各技术当前的真实生态位。LSF 目前仍被困在“实验室/温室”阶段，跨越死亡之谷（解决Gap）是其走向大田的关键。</p>
    </div>
    
    <div id="chart-container"></div>

    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        
        // 数据结构：[X轴(大田落地成熟度), Y轴(大田应用普及率), 大小, 技术名称, 现状描述]
        // X轴：0-100 (实验室模型 -> 温室实验 -> 大田示范 -> 规模化商用)
        // Y轴：0-100 (无人问津/极小众 -> 行业标配)
        const data = [
            // 第一梯队：大规模商用标配 (高成熟，高普及)
            [95, 95, 25, 'RGB 成像', '现状：行业绝对标配，无人机/手机随时可用，算法极其成熟。'],
            [85, 80, 22, '多光谱 (MSI)', '现状：精准农业的主力军，大疆等农业无人机已实现标配量产。'],
            [80, 75, 20, '热红外 (TIR)', '现状：商用化程度高，常与多光谱挂载于同一无人机进行旱情监测。'],
            [85, 70, 20, '激光雷达 (LiDAR)', '现状：农机自动驾驶和地形测绘的核心，硬件成本正在快速下降中。'],
            [75, 50, 18, '被动三维', '现状：软件算法成熟，作为廉价3D方案在田间表型平台中广泛应用。'],

            // 第二梯队：从科研走向大田的过渡期 (中成熟，中普及)
            [65, 45, 18, '近红外 (NIR)', '现状：多集成于多光谱设备中，针对特定病害（如穗枯病）有专门的应用模型。'],
            [60, 40, 18, '高光谱 (HSI)', '现状：处于“科研转商用”的阵痛期。设备太贵、数据太庞大，限制了其全面下地。'],
            [55, 30, 15, '合成孔径雷达 (SAR)', '现状：卫星端应用成熟，但无人机/地面端因解译门槛极高，仍多用于政府级宏观监测。'],
            [50, 35, 15, '日光诱导荧光 (SIF)', '现状：卫星遥感层面已取得突破，但近地面大田应用受限于极微弱信号的提取难题。'],
            [55, 25, 15, '短波红外 (SWIR)', '现状：传感器成本居高不下，目前主要在高端表型平台或特定高附加值作物中示范。'],

            // 第三梯队：困于实验室/温室的“潜力股” (低落地，低普及，但技术壁垒高)
            [15, 10, 15, 'X射线 (CT)', '现状：技术本身极成熟，但因辐射和笨重，100%锁死在实验室，不可能下大田。'],
            [25, 15, 15, '相干断层 (OCT)', '现状：医用成熟，农业起步。受限于几毫米的穿透深度，只能在显微环境下研究切片。'],
            [40, 25, 16, '叶绿素荧光 (CFI)', '现状：植物生理学研究的标准工具，但极其依赖暗室和近距离接触，难以实现大田高通量。'],
            [45, 20, 15, '紫外成像 (UV)', '现状：多用于室内种子分拣或温室病害研究，大田强烈紫外背景阻碍了其室外发展。'],
            [35, 15, 15, '偏振成像', '现状：处于机理探索阶段，缺乏大规模田间样本数据库支撑模型建立。'],

            // LSF 的现状定位
            [30, 18, 22, '激光激发荧光 (LSF)', '现状：【科研攻坚期】拥有降维打击的潜力，但目前受制于暗适应和猝灭，被“锁”在实验室或小范围温室中，急需突破大田原位提取算法。']
        ];

        const option = {
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(255,255,255,0.95)',
                padding: 15,
                textStyle: { color: '#333' },
                formatter: function (params) {
                    if(params.componentType === 'markArea') return '';
                    return `<div style="max-width:300px; white-space:normal;">
                                <h3 style="margin:0 0 10px 0; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:5px;">${params.data[3]}</h3>
                                <p style="margin:5px 0; color:#e67e22; font-size:13px; line-height:1.5;">${params.data[4]}</p>
                            </div>`;
                }
            },
            grid: { left: '8%', right: '10%', bottom: '12%', top: '10%' },
            xAxis: { 
                name: '实验室培育 ⬅️   X轴：大田真实场景落地成熟度   ➡️ 规模化大田商用', 
                nameLocation: 'middle', nameGap: 35, nameTextStyle: { fontWeight: 'bold', fontSize: 13 },
                min: 0, max: 100, splitLine: { lineStyle: { type: 'dashed' } }, axisLabel: { show: false }
            },
            yAxis: { 
                name: '小众/仅科研 ⬇️   Y轴：农业市场应用普及率   ⬆️ 行业标准配置', 
                nameLocation: 'middle', nameGap: 40, nameTextStyle: { fontWeight: 'bold', fontSize: 13 },
                min: 0, max: 100, splitLine: { lineStyle: { type: 'dashed' } }, axisLabel: { show: false }
            },
            series: [
                {
                    type: 'scatter',
                    data: data,
                    symbolSize: function (data) { return data[2]; },
                    itemStyle: {
                        color: function(params) {
                            if(params.data[3].includes('LSF')) return '#8e44ad'; // LSF 紫色
                            return '#3498db'; // 统一蓝色
                        },
                        shadowBlur: 5, shadowColor: 'rgba(0,0,0,0.2)'
                    },
                    label: {
                        show: true,
                        formatter: function(param) { return param.data[3]; },
                        position: 'right',
                        distance: 10,
                        textStyle: { fontSize: 12, fontWeight: 'bold', color: '#333' }
                    },
                    markArea: {
                        silent: true,
                        data: [
                            [
                                { name: '【第三梯队】\n困于实验室/温室的 科研核心区\n(缺乏大田适应性)', xAxis: 0, yAxis: 0, itemStyle: { color: 'rgba(231, 76, 60, 0.05)' }, label: { position: 'insideBottomLeft', color: '#c0392b', fontSize: 14, fontWeight: 'bold', padding: 20 } },
                                { xAxis: 45, yAxis: 45 }
                            ],
                            [
                                { name: '【第二梯队】\n跨越死亡之谷：技术下地示范区\n(解决成本与抗干扰)', xAxis: 45, yAxis: 0, itemStyle: { color: 'rgba(241, 196, 15, 0.05)' }, label: { position: 'insideBottom', color: '#d35400', fontSize: 14, fontWeight: 'bold', padding: 20 } },
                                { xAxis: 75, yAxis: 70 }
                            ],
                            [
                                { name: '【第一梯队】\n大规模大田商用标配区\n(成熟、稳定、廉价)', xAxis: 75, yAxis: 45, itemStyle: { color: 'rgba(46, 204, 113, 0.08)' }, label: { position: 'insideTopRight', color: '#27ae60', fontSize: 14, fontWeight: 'bold', padding: 20 } },
                                { xAxis: 100, yAxis: 100 }
                            ]
                        ]
                    },
                    // 动态箭头：展示 LSF 的突围路径
                    markLine: {
                        symbol: ['none', 'arrow'],
                        symbolSize: 10,
                        lineStyle: { color: '#8e44ad', width: 3, type: 'dashed' },
                        data: [
                            {
                                name: 'LSF 突围路线',
                                coord: [30, 18], // 起点 LSF
                            },
                            {
                                coord: [60, 60] // 终点 指向商用区
                            }
                        ],
                        label: { formatter: '解决痛点\n推向大田', position: 'middle', color: '#8e44ad', fontWeight: 'bold', fontSize: 12 }
                    }
                }
            ]
        };

        myChart.setOption(option);
        window.addEventListener('resize', function() { myChart.resize(); });
    </script>
</body>
</html>
