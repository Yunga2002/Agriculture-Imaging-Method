<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>面向大田环境的成像技术双维性能空间及 LSF 技术挑战</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #f7f9fc; }
        #chart-container { width: 100%; height: 88vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { color: #2c3e50; margin: 0 0 8px 0; font-size: 24px; }
        .header p { color: #e74c3c; font-size: 14px; margin: 0; font-weight: bold; background: #fdf2f2; display: inline-block; padding: 6px 15px; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🎯 面向大田环境的成像技术双维性能空间及 LSF 技术挑战</h2>
        <p>※ 声明：各技术位置为基于典型应用特征的概念性定位 (Conceptual Positioning)，并非统一实验条件下的定量性能评分。</p>
    </div>
    
    <div id="chart-container"></div>

    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        
        // 严格按照专家意见修正的学术措辞数据
        const data = [
            // 左下象限
            [15, 15, 15, 'RGB 成像', '高通量，实时，低成本。', '主要获取表型几何与色彩信息，生理生化信息维度有限，易受阴影反光干扰。'],
            [25, 20, 15, '被动三维', '可获取高密度三维结构信息，设备成本相对较低。', '环境鲁棒性弱，受光照和风吹影响显著。'],

            // 右下象限
            [70, 30, 18, '多光谱(MSI)', '获取理化特性和植被指数。', '受云层和光照变化显著影响。'],
            [75, 35, 18, '近红外(NIR)', '对水分、结构及部分生理生化状态敏感。', '受物种、冠层结构及环境条件影响，跨场景泛化能力有限。'],
            [85, 20, 18, '高光谱(HSI)', '连续光谱指纹，极高分辨率。', '环境光变化显著影响测量稳定性，高维光谱数据带来模型复杂度与泛化挑战。'],
            [80, 25, 15, '短波红外(SWIR)', '敏感于水分与特定生化标志物。', '易受光线、湿度波动引入噪声。'],
            [60, 20, 15, '紫外(UV)', '揭示表面次生代谢物。', '穿透浅，易受大田强光背景掩盖。'],
            [65, 15, 15, '偏振成像', '高对比度，抑制背景。', '受诸多环境因素影响，物理参数敏感。'],
            [90, 45, 18, '热红外(TIR)', '通过叶片/冠层温度变化反映蒸腾与气孔调控状态，可用于水分胁迫早期监测。', '需剔除复杂的土壤与环境背景干扰。'],
            [95, 35, 15, '日光诱导荧光(SIF)', '与光合电子传递和 GPP 密切相关，可用于估算光合生产力。', '目标信号极弱，极易被太阳背景光谱重叠掩盖。'],

            // 左上象限
            [10, 85, 20, '激光雷达(LiDAR)', '主动发射激光，对环境照明变化具有较强鲁棒性，并可获取冠层三维结构信息。', '主要提供结构与几何信息，直接生理生化信息有限。'],
            [20, 95, 20, '合成孔径雷达(SAR)', '主动微波探测，具备全天时、全天候观测能力，对植被结构与土壤介电特性敏感。', '主攻物理结构与介电常数，生化反演难度极高。'],
            [35, 80, 15, '相干断层(OCT)', '高分辨率获取活体组织微观截面结构。', '穿透极浅，多限于实验室内控环境。'],
            [15, 100, 15, 'X射线(CT)', '深层无损获取三维密度结构信息。', '细胞界面生化对比度低，设备无法下地。'],

            // 右上象限 (理想概念区)
            [80, 75, 18, '叶绿素荧光(CFI)', '主动激发，反映光合生理状态。', '对测量条件及探头几何配置敏感。'],
            
            // LSF 定位 (克制、严谨的潜力表述)
            [92, 85, 22, '激光激发荧光 (LSF)', '主动远距离激发，具备高灵敏获取多维生理生化荧光信息的潜力。', '面临复杂田间环境下的定量反演与光化学状态变化的挑战。']
        ];

        const option = {
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(255,255,255,0.98)',
                borderColor: '#e2e8f0',
                padding: 18,
                textStyle: { color: '#333' },
                formatter: function (params) {
                    if(params.componentType === 'markArea') return '';
                    return `<div style="max-width:380px; white-space:normal;">
                                <h3 style="margin:0 0 12px 0; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:8px; font-size:16px;">${params.data[3]}</h3>
                                <p style="margin:8px 0; color:#27ae60; font-size:13px; line-height:1.6;"><b>✔ 优势特征：</b>${params.data[4]}</p>
                                <p style="margin:8px 0; color:#c0392b; font-size:13px; line-height:1.6;"><b>✖ 局限挑战：</b>${params.data[5]}</p>
                            </div>`;
                }
            },
            grid: { left: '8%', right: '8%', bottom: '10%', top: '8%' },
            xAxis: { 
                name: '纯物理形态信息 ⬅️   X轴：生理生化信息的获取能力与维度   ➡️ 高维生理生化信息', 
                nameLocation: 'middle', nameGap: 30, nameTextStyle: { fontWeight: 'bold', fontSize: 13 },
                min: 0, max: 115, splitLine: { show: false }, axisLabel: { show: false }
            },
            yAxis: { 
                name: '易受环境背景干扰 ⬇️   Y轴：环境鲁棒性与主动抗干扰能力   ⬆️ 强环境鲁棒性', 
                nameLocation: 'middle', nameGap: 40, nameTextStyle: { fontWeight: 'bold', fontSize: 13 },
                min: 0, max: 125, splitLine: { show: false }, axisLabel: { show: false }
            },
            series: [
                {
                    type: 'scatter',
                    data: data,
                    symbolSize: function (data) { return data[2]; },
                    itemStyle: {
                        color: function(params) {
                            if(params.data[3].includes('LSF')) return '#8e44ad'; 
                            if(params.data[1] < 50 && params.data[0] > 50) return '#3498db'; 
                            if(params.data[1] > 50 && params.data[0] < 50) return '#2ecc71'; 
                            if(params.data[1] < 50 && params.data[0] < 50) return '#95a5a6'; 
                            return '#e67e22'; 
                        },
                        shadowBlur: 5, shadowColor: 'rgba(0,0,0,0.2)'
                    },
                    label: {
                        show: true,
                        formatter: function(param) { return param.data[3]; },
                        position: 'top',
                        textStyle: { fontSize: 12, fontWeight: 'bold', color: '#333' }
                    },
                                        markPoint: {
                        symbol: 'rect',
                        symbolSize: [420, 110], // 稍微再加宽一点，确保文字绝不溢出
                        symbolOffset: [0, '-105%'], // 👈 关键修改：水平偏移改为 0，也就是正居中；垂直方向向上抬高
                        data: [
                            {
                                coord: [92, 85], 
                                value: '核心技术瓶颈 (Gap):\n1. 部分荧光参数测定依赖稳定光化学状态或暗适应\n2. 重复或高能激发可能引起荧光猝灭、光漂白及光化学状态变化\n3. 复杂田间环境下定量反演与跨场景校准能力有限',
                                itemStyle: { color: '#fff', borderColor: '#e74c3c', borderWidth: 2, shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.1)' },
                                label: { color: '#c0392b', fontSize: 12, fontWeight: 'bold', lineHeight: 18, padding: [8, 12, 8, 12], align: 'left' } // 👈 增加 align: 'left' 保证长句对齐美观
                            }
                        ]
                    }

                            {
                                coord: [92, 85], 
                                value: '核心技术瓶颈 (Gap):\n1. 部分荧光参数测定依赖稳定光化学状态或暗适应\n2. 重复或高能激发可能引起荧光猝灭、光漂白及光化学状态变化\n3. 复杂田间环境下定量反演与跨场景校准能力有限',
                                itemStyle: { color: '#fff', borderColor: '#e74c3c', borderWidth: 2, shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.1)' },
                                label: { color: '#c0392b', fontSize: 12, fontWeight: 'bold', lineHeight: 18, padding: [8, 12, 8, 12], align: 'left' } // 👈 增加 align: 'left' 保证长句对齐美观
                            }
                        ]
                    }

                            {
                                coord: [92, 85], 
                                value: '核心技术瓶颈 (Gap):\n1. 部分荧光参数测定依赖稳定光化学状态或暗适应\n2. 重复或高能激发可能引起荧光猝灭、光漂白及光化学状态变化\n3. 复杂田间环境下定量反演与跨场景校准能力有限',
                                itemStyle: { color: '#fff', borderColor: '#e74c3c', borderWidth: 2, shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.1)' },
                                label: { color: '#c0392b', fontSize: 12, fontWeight: 'bold', lineHeight: 18, padding: [8, 12, 8, 12], align: 'left' }
                            }
                        ]
                    }
                }
            ]
        };

        myChart.setOption(option);
        window.addEventListener('resize', function() { myChart.resize(); });
    </script>
</body>
</html>
